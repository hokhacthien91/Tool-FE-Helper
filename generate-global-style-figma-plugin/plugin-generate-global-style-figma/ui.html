<!DOCTYPE html>
<html>
<head>
     <meta charset="utf-8" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), clipboard-write=(), display-capture=(), local-network-access=()"
    />
    <title>Generate Global Style</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
           margin: 0 auto;
      max-width: 1000px;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
    }
    .options-container {
      display: flex;
      gap: 16px;
    }
    .option-card {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #f9f9f9;
    }
    .option-card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .option-card p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #222;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #18A0FB;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #0d8de5;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 4px 0;
    }
    .message {
      margin-top: 16px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .message.show {
      display: block;
    }
    .message.error {
      background: #ffe0e0;
      color: #d32f2f;
    }
    .message.success {
      background: #e0f7e0;
      color: #2e7d32;
    }
    .message.loading {
      background: #e3f2fd;
      color: #1976d2;
    }
    .checkbox-group {
      margin: 12px 0;
      padding: 10px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .prefix-input {
      margin-top: 8px;
      display: none;
    }
    .prefix-input.show {
      display: block;
    }
    .prefix-input label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    .prefix-input input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .prefix-input input:focus {
      outline: none;
      border-color: #18A0FB;
    }
    .prefix-hint {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #1976d2;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Generate Global Style</h2>

  <div class="options-container">
    <div class="option-card">
      <h3>Option 1: From JSON File</h3>
      <p>Upload a json file to generate the style guide.</p>
      <input type="file" id="fileInput" accept=".json">

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="createVariablesCheckbox">
          Create Variables & Text Styles
        </label>
        <div class="prefix-input" id="prefixInputContainer">
          <label for="prefixInput">Prefix (to avoid duplicates):</label>
          <input type="text" id="prefixInput" placeholder="e.g., MG, NewQuest">
          <div class="prefix-hint">e.g., Colors - [Prefix], Desktop - [Prefix]/H1</div>
        </div>
      </div>

      <button id="generateBtn" disabled>Generate</button>
    </div>

    <div class="option-card">
      <h3>Option 2: From Figma Variables & Styles</h3>
      <p>Generate from existing Variables and Styles in your Figma file.</p>
      <button id="generateFromFigmaBtn">Generate</button>
    </div>
  </div>

  <div id="message" class="message"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const generateFromFigmaBtn = document.getElementById('generateFromFigmaBtn');
    const message = document.getElementById('message');
    const createVariablesCheckbox = document.getElementById('createVariablesCheckbox');
    const prefixInputContainer = document.getElementById('prefixInputContainer');
    const prefixInput = document.getElementById('prefixInput');

    fileInput.addEventListener('change', () => {
      generateBtn.disabled = !fileInput.files.length;
      message.className = 'message';
    });

    // Toggle prefix input visibility when checkbox is checked/unchecked
    createVariablesCheckbox.addEventListener('change', () => {
      prefixInputContainer.className = createVariablesCheckbox.checked
        ? 'prefix-input show'
        : 'prefix-input';
    });

    generateBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          const createVariables = createVariablesCheckbox.checked;
          const prefix = prefixInput.value.trim();

          showLoading('Generating global style from JSON...');
          generateBtn.disabled = true;
          generateFromFigmaBtn.disabled = true;
          parent.postMessage({
            pluginMessage: {
              type: 'generate',
              data: json,
              createVariables: createVariables,
              prefix: prefix
            }
          }, '*');
        } catch (err) {
          message.textContent = 'Invalid JSON file.';
          message.className = 'message error show';
        }
      };
      reader.readAsText(file);
    });

    generateFromFigmaBtn.addEventListener('click', () => {
      showLoading('Generating global style from Figma Variables & Styles...');
      generateBtn.disabled = true;
      generateFromFigmaBtn.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'generateFromFigma' } }, '*');
    });

    function showLoading(text) {
      message.innerHTML = '<span class="spinner"></span>' + text;
      message.className = 'message loading show';
    }

    function hideLoading() {
      generateBtn.disabled = !fileInput.files.length;
      generateFromFigmaBtn.disabled = false;
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'status') {
        hideLoading();
        message.textContent = msg.message;
        message.className = msg.error ? 'message error show' : 'message success show';
      }
    };
  </script>
</body>
</html>

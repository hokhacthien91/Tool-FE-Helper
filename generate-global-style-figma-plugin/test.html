<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero Lens Distortion (1-file)</title>
  <style>
    :root { --bg: #f3f3f0; --fg: #0a0a0a; }

    html, body { height: 100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
    }

    /* grid nhẹ giống screenshot */
    .grid {
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(to right, rgba(0,0,0,.06) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(to bottom, rgba(0,0,0,.035) 0 1px, transparent 1px 60px);
      opacity: .35;
      pointer-events:none;
    }

    .wrap{
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
    }

    /* text layout gần giống */
    .hero{
      width: min(1200px, 92vw);
      height: auto;
      user-select: none;
      cursor: default;
    }

    /* subtitle */
    .meta{
      position: absolute;
      left: 6vw;
      bottom: 16vh;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 600;
    }
    .meta small{
      display:block;
      font-weight: 500;
      opacity: .55;
      margin-top: 14px;
      letter-spacing: .08em;
    }

    /* giúp cảm giác “hit area” cho lens */
    .hit{
      position:absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <div class="grid"></div>

  <div class="wrap" id="wrap">
    <svg class="hero" id="hero" viewBox="0 0 1400 560" aria-label="Eva Sánchez">
      <defs>
        <!-- filter tạo cảm giác “blob/distort” trong lens -->
        <filter id="blobDistort" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence id="turb"
            type="fractalNoise"
            baseFrequency="0.006"
            numOctaves="2"
            seed="3"
            result="noise"/>
          <feDisplacementMap id="disp"
            in="SourceGraphic"
            in2="noise"
            scale="0"
            xChannelSelector="R"
            yChannelSelector="G"
            result="displaced"/>

          <!-- làm dày/bo “mảng tròn” hơn một chút -->
          <feGaussianBlur in="displaced" stdDeviation="0.35" result="blurred"/>
          <feComponentTransfer in="blurred" result="thresholded">
            <feFuncR type="gamma" amplitude="1" exponent="0.8" offset="0"/>
            <feFuncG type="gamma" amplitude="1" exponent="0.8" offset="0"/>
            <feFuncB type="gamma" amplitude="1" exponent="0.8" offset="0"/>
          </feComponentTransfer>
        </filter>

        <!-- mask hình tròn (lens) bám theo chuột -->
        <mask id="lensMask">
          <rect width="100%" height="100%" fill="black"/>
          <circle id="lens" cx="700" cy="280" r="0" fill="white"/>
        </mask>
      </defs>

      <!-- Layer chữ bình thường -->
      <g>
        <text x="170" y="235"
              font-size="230"
              font-weight="800"
              letter-spacing="-10">
          Eva
        </text>

        <text x="170" y="470"
              font-size="300"
              font-weight="800"
              letter-spacing="-16">
          Sánchez
        </text>
      </g>

      <!-- Layer chữ distorted, chỉ hiện trong lens -->
      <g mask="url(#lensMask)" filter="url(#blobDistort)">
        <text x="170" y="235"
              font-size="230"
              font-weight="800"
              letter-spacing="-10">
          Eva
        </text>

        <text x="170" y="470"
              font-size="300"
              font-weight="800"
              letter-spacing="-16">
          Sánchez
        </text>
      </g>
    </svg>

    <div class="meta">
      Interactive Designer<br/>
      Based in Barcelona
      <small>PORTFOLIO_20/24</small>
    </div>

    <div class="hit" id="hit"></div>
  </div>

  <script>
    const wrap = document.getElementById("wrap");
    const hit  = document.getElementById("hit");

    const lens = document.getElementById("lens");
    const turb = document.getElementById("turb");
    const disp = document.getElementById("disp");

    // state
    let active = false;
    let mx = 700, my = 280;       // target
    let x  = 700, y  = 280;       // smooth
    let rTarget = 0, r = 0;       // radius
    let sTarget = 0, s = 0;       // displacement scale
    let t = 0;

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function onMove(e){
      const rect = wrap.getBoundingClientRect();
      mx = e.clientX - rect.left;
      my = e.clientY - rect.top;

      // giữ lens trong khung (đỡ “bay” ra ngoài)
      mx = clamp(mx, 0, rect.width);
      my = clamp(my, 0, rect.height);
    }

    hit.addEventListener("pointerenter", () => {
      active = true;
      rTarget = 160;   // size lens (tăng/giảm để giống hơn)
      sTarget = 45;    // độ méo
    });

    hit.addEventListener("pointerleave", () => {
      active = false;
      rTarget = 0;
      sTarget = 0;
    });

    hit.addEventListener("pointermove", onMove);

    function tick(){
      t += 0.012;

      // smooth follow
      x += (mx - x) * 0.18;
      y += (my - y) * 0.18;

      // smooth radius/scale
      r += (rTarget - r) * 0.14;
      s += (sTarget - s) * 0.12;

      // animate turbulence để “living”
      const bf = 0.006 + Math.sin(t) * 0.0018;
      turb.setAttribute("baseFrequency", `${bf} ${bf*0.95}`);

      lens.setAttribute("cx", x.toFixed(2));
      lens.setAttribute("cy", y.toFixed(2));
      lens.setAttribute("r",  r.toFixed(2));

      disp.setAttribute("scale", s.toFixed(2));

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>

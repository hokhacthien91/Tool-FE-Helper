<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
    }
    .options-container {
      display: flex;
      gap: 16px;
    }
    .option-card {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #f9f9f9;
    }
    .option-card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .option-card p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #222;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #18A0FB;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #0d8de5;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 4px 0;
    }
    .message {
      margin-top: 16px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .message.show {
      display: block;
    }
    .message.error {
      background: #ffe0e0;
      color: #d32f2f;
    }
    .message.success {
      background: #e0f7e0;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h2>Generate Global Style</h2>

  <div class="options-container">
    <div class="option-card">
      <h3>Option 1: From JSON File</h3>
      <p>Upload a json file to generate the style guide.</p>
      <input type="file" id="fileInput" accept=".json">
      <button id="generateBtn" disabled>Generate</button>
    </div>

    <div class="option-card">
      <h3>Option 2: From Figma Variables & Styles</h3>
      <p>Generate from existing Variables and Styles in your Figma file.</p>
      <button id="generateFromFigmaBtn">Generate</button>
    </div>
  </div>

  <div id="message" class="message"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const generateFromFigmaBtn = document.getElementById('generateFromFigmaBtn');
    const message = document.getElementById('message');

    fileInput.addEventListener('change', () => {
      generateBtn.disabled = !fileInput.files.length;
      message.className = 'message';
    });

    generateBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          parent.postMessage({ pluginMessage: { type: 'generate', data: json } }, '*');
        } catch (err) {
          message.textContent = 'Invalid JSON file.';
          message.className = 'message error show';
        }
      };
      reader.readAsText(file);
    });

    generateFromFigmaBtn.addEventListener('click', () => {
      message.className = 'message';
      parent.postMessage({ pluginMessage: { type: 'generateFromFigma' } }, '*');
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'status') {
        message.textContent = msg.message;
        message.className = msg.error ? 'message error show' : 'message success show';
      }
    };
  </script>
</body>
</html>

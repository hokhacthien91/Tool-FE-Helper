<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Cloner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="tab-bar">
      <button class="tab-btn active" data-mode="documents">Documents</button>
      <button class="tab-btn" data-mode="artboards">Artboards</button>
      <button class="tab-btn" data-mode="settings">Settings</button>
    </div>

    <div class="section">
      <label class="label" for="sizesInput">Target Sizes 5</label>
      <input id="sizesInput" type="text" value="300x250" />
      <div class="hint">Enter sizes separated by spaces or commas</div>
      <div id="presetWrap" class="preset-wrap"></div>
    </div>

    <div class="section checkboxes">
      <label class="checkbox-row"><input id="suffixName" type="checkbox" checked /> <span>Append size suffix to name</span></label>
    </div>

    <div class="section">
      <label class="label" for="skipLayerInput">Background Layer</label>
      <input id="skipLayerInput" type="text" value="background" />
      <div class="hint">This layer/group will be scaled as cover instead of repositioned</div>
    </div>

    <div class="section btn-row">
      <button id="cloneBtn" class="primary">Clone Artboards</button>
      <button id="exportBtn" class="primary export-all-btn">Export</button>
    </div>

    <div class="section" id="splitSection" style="display:none;">
      <button id="splitBtn" class="primary full split-btn">Split to Documents</button>
      <div class="hint">Split each artboard into a separate document and save as PSD.</div>
    </div>

    <div class="section info-card">
      <div><strong>Source:</strong> <span id="sourceName">-</span></div>
      <div><strong>Size:</strong> <span id="sourceSize">-</span></div>
      <button id="refreshBtn" class="link-btn">Refresh Source</button>
    </div>

    <div class="section">
      <label class="label">Logs</label>
      <pre id="logBox" class="log-box">Ready.</pre>
    </div>

    <!-- Settings Panel (hidden by default) -->
    <div id="settingsPanel" class="settings-panel" style="display:none;">
      <div class="section">
        <label class="label">Layer Rules</label>
        <div class="hint">Auto-synced from Target Sizes. Set position/scale for layers in each size.</div>
      </div>

      <div id="sizeGroupsContainer"></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
